name: build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (z. B. 0.1.0)"
        required: false
        default: "0.1.0"

jobs:
  test-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Core-Tests (inkl. Cross-Language-Signatur-Fixture)
        run: dotnet test client/FrohLock.Tests/FrohLock.Tests.csproj -c Release

  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pytest
        working-directory: server
        run: PYTHONPATH=. python -m pytest tests/ -q

  build-installer:
    runs-on: windows-latest
    needs: [ test-dotnet, test-server ]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    env:
      SIGNING_PUBLIC_KEY: ${{ secrets.SIGNING_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version bestimmen
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $v = $env:GITHUB_REF -replace "refs/tags/v",""
          } elseif ("${{ github.event.inputs.version }}") {
            $v = "${{ github.event.inputs.version }}"
          } else { $v = "0.1.0" }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "Version: $v"

      - name: Produktiven Public Key injizieren (falls Secret gesetzt)
        if: ${{ env.SIGNING_PUBLIC_KEY != '' }}
        shell: pwsh
        run: |
          $env:SIGNING_PUBLIC_KEY | Out-File -FilePath prod_public.pem -Encoding ascii
          pwsh tools/inject-public-key.ps1 -PemPath prod_public.pem

      - name: Client publishen
        shell: pwsh
        run: pwsh tools/publish-client.ps1

      - name: Inno Setup installieren
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Installer kompilieren
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer/frohlock.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC fehlgeschlagen" }

      - name: SHA256 berechnen
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer/Output/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File installer/Output/SHA256SUMS.txt -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: FrohLockSetup-${{ steps.ver.outputs.version }}
          path: |
            installer/Output/*.exe
            installer/Output/SHA256SUMS.txt

      - name: Release anhängen (bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/*.exe
            installer/Output/SHA256SUMS.txt
