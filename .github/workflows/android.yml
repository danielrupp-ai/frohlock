name: android

on:
  push:
    branches: [ main ]
    tags: [ "android-v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    env:
      KEYSTORE_B64: ${{ secrets.FROHLOCK_ANDROID_KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.FROHLOCK_ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Version bestimmen
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then v="${GITHUB_REF#refs/tags/android-v}"; else v="0.0.0"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "Version: $v"

      - name: Release-Schlüssel (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Secret FROHLOCK_ANDROID_KEYSTORE_B64 fehlt"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "FROHLOCK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "FROHLOCK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Tests, Lint, APK
        run: ./gradlew --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease -PfrohlockVersion=${{ steps.ver.outputs.version }}

      - name: APK benennen + Prüfsummen
        run: |
          v=${{ steps.ver.outputs.version }}
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/FrohLock-$v.apk"
          (cd out && sha256sum "FrohLock-$v.apk" > SHA256SUMS.txt)
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          hex=$("$bt/apksigner" verify --print-certs "out/FrohLock-$v.apk" | grep "SHA-256 digest" | head -1 | awk '{print $NF}')
          # Für den QR-Code: Base64url (ohne =) der SHA-256 des Signaturzertifikats.
          echo -n "$hex" | xxd -r -p | base64 | tr '+/' '-_' | tr -d '=' > out/android-cert.txt
          echo "Zertifikat: $(cat out/android-cert.txt)"; cat out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FrohLock-android-${{ steps.ver.outputs.version }}
          path: android/out/*

      - name: Release anhängen (bei Tag)
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: FrohLock Android ${{ steps.ver.outputs.version }}
          files: |
            android/out/*.apk
            android/out/android-cert.txt
            android/out/SHA256SUMS.txt
